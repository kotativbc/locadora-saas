name: rental-saas

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/rental-data/postgres:/var/lib/postgresql/data
    # SEM "ports:" DE PROPÓSITO — o Postgres só é alcançável pelos outros
    # serviços dentro da rede interna do Docker, nunca pela internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      DATA_ROOT: /data
      NODE_ENV: production
    volumes:
      - /srv/rental-data:/data
      - ./apps/api/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    # SEM "ports:" — só o Caddy fala com a API, via rede interna do Docker.
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/web:ro
      - /srv/rental-data/caddy/data:/data
      - /srv/rental-data/caddy/config:/config
    depends_on:
      - api
    networks: [internal]

networks:
  internal:
    driver: bridge
